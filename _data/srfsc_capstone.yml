  - "Volunteers, donates, or joins a program"

# Yard Walk game. Each round pairs one hazard with its fix; ids must be unique.
# Zones follow CAL FIRE defensible space guidance, matching the checklist in the live redesign.
Game:
  Title: "Yard Walk: fix the fire hazards"
  Intro: "Walk the yard with a council volunteer. Drag each hazard onto its fix, or select a hazard and then its fix. Every wrong match costs 10 points."
  # Reference table shown under the board (no answers given away).
  Zones:
    - { zone: "Zone 0", distance: "0-5 ft", goal: "Ember-resistant: nothing that burns touches the house" }
    - { zone: "Zone 1", distance: "5-30 ft", goal: "Lean, clean, and green: trimmed, spaced plants" }
    - { zone: "Zone 2", distance: "30-100 ft", goal: "Reduce fuel: short grass and no ladder fuels" }
  StartingScore: 100
  Penalty: 10
  Rounds:
    - { id: "gutters", hazard: "Dry leaves packed in the gutters", fix: "Clear the roof and gutters", zone: "Zone 0", tip: "Embers land on roofs first. Clean gutters remove the easiest fuel." }
    - { id: "firewood", hazard: "Firewood stacked against the wall", fix: "Move firewood 30 ft from the house", zone: "Zone 0", tip: "Nothing that burns should sit within 5 ft of the house." }
    - { id: "vents", hazard: "Open attic and crawlspace vents", fix: "Cover vents with 1/8-inch metal mesh", zone: "Zone 0", tip: "Fine mesh keeps embers from blowing inside the house." }
    - { id: "branches", hazard: "Tree branches hanging over the roof", fix: "Trim branches 10 ft from roof and chimney", zone: "Zone 1", tip: "Branch clearance stops flames from reaching the roof." }
    - { id: "ladder", hazard: "Shrubs growing under a tall pine", fix: "Remove ladder fuels below the canopy", zone: "Zone 2", tip: "Ladder fuels let a ground fire climb into the treetops." }
    - { id: "grass", hazard: "Knee-high dry grass on the slope", fix: "Mow annual grass to 4 inches or less", zone: "Zone 2", tip: "Short grass keeps flames low and slow near the canyon." }
  # Ratings are checked top to bottom; the first with min at or below the final score wins.
  Ratings:
    - { min: 90, label: "Firewise champion", tone: "good", text: "Your yard is ready for fire season. Share the checklist with a neighbor." }
    - { min: 60, label: "Getting there", tone: "warn", text: "Most hazards are handled. Review the Zone 0 tips, then try again." }
    - { min: 0, label: "High risk", tone: "bad", text: "Join a Clearing Day to learn these fixes with a volunteer." }
  Actions:
    - { label: "Try the full checklist", href: "/capstone/srfsc/app/prepare/" }
    - { label: "Join a Clearing Day", href: "/capstone/srfsc/app/events/" }
